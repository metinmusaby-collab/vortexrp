name: RPCore
version: '1.0.0'
main: com.rpserver.core.RPCore
api-version: '1.21'
author: RPCore
description: Gercek hayat simulasyonu RP eklentisi

commands:
  rp:
    description: Konum yonetimi (admin)
    usage: /rp set|remove|list|tp ...
    permission: rpcore.admin
  ev:
    description: Ev satin alma/kiralama menusu
  isyeri:
    description: Is yeri satin alma/kiralama menusu
  market:
    description: Market menusu
  restoran:
    description: Restoran menusu
  is:
    description: Meslek menusu
    usage: /is [birak]
  polis:
    description: Polis nobet ac/kapat
  banka:
    description: Banka menusu
    usage: /banka [gonder <oyuncu> <miktar>]
  araba:
    description: Araba galerisi / garaj
    usage: /araba [cagir|park]
  takim:
    description: Futbol takimi yonetimi
    usage: /takim kur|katil|ayril <isim>
  lig:
    description: Futbol ligi puan durumu
  telefon:
    description: Telefon ana menusu
  sosyal:
    description: Sosyal medyaya paylasim yap
    usage: /sosyal <mesaj>
  su:
    description: Su ic

permissions:
  rpcore.admin:
    description: RP eklentisi admin yetkisi
    default: op
